<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPT Batch Search</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fb;
      --panel: #ffffff;
      --panel-soft: #eef2f7;
      --text: #172033;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: rgb(56, 125, 201);
      --accent-soft: rgba(56, 125, 201, .16);
      --shadow: 0 18px 40px rgba(15, 23, 42, .16);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15171b;
        --panel: #202329;
        --panel-soft: #2a2e35;
        --text: #eef2f7;
        --muted: #a1a8b3;
        --border: #353b45;
        --accent: rgb(56, 125, 201);
        --accent-soft: rgba(56, 125, 201, .16);
        --shadow: 0 18px 40px rgba(0, 0, 0, .3);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 360px;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "微软雅黑", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
    }

    .popup {
      padding: 18px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .logo {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      box-shadow: var(--shadow);
    }

    .title {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.25;
    }

    .subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      overflow: hidden;
    }

    .switch-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
    }

    .switch-main {
      flex: 1;
      min-width: 0;
    }

    .switch-title {
      font-size: 15px;
      font-weight: 750;
    }

    .switch-desc {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.55;
    }

    .switch {
      position: relative;
      display: inline-flex;
      width: 48px;
      height: 28px;
      flex: 0 0 auto;
      cursor: pointer;
    }

    .switch input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: #c8cdd4;
      transition: background .18s ease;
    }

    .slider::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 8px rgba(15, 23, 42, .18);
      transition: transform .18s ease;
    }

    .switch input:checked + .slider {
      background: var(--accent);
    }

    .switch input:checked + .slider::after {
      transform: translateX(20px);
    }

    .switch input:focus-visible + .slider {
      outline: 3px solid var(--accent-soft);
      outline-offset: 3px;
    }

    .status {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 12.5px;
      min-height: 39px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      border-color: var(--accent);
      outline: 0;
    }

    .primary {
      flex: 1;
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .secondary {
      width: 110px;
    }
  </style>
</head>
<body>
  <main class="popup">
    <header class="header">
      <div class="logo">G</div>
      <div>
        <div class="title">GPT Batch Search</div>
        <div class="subtitle">快捷消息控制面板</div>
      </div>
    </header>

    <section class="panel" aria-label="快捷消息设置">
      <div class="switch-row">
        <div class="switch-main">
          <div class="switch-title">选中文本提示按钮</div>
          <div class="switch-desc">开启后，在普通网页选中文本时显示 GPT 发送按钮，并在当前页面显示回答。</div>
        </div>
        <label class="switch" title="开关选中文本提示按钮">
          <input id="selectionBubbleEnabled" type="checkbox">
          <span class="slider" aria-hidden="true"></span>
        </label>
      </div>
      <div id="status" class="status">正在读取设置...</div>
    </section>

    <div class="actions">
      <button id="openOptions" class="primary" type="button">打开完整设置</button>
      <button id="openShortcuts" class="secondary" type="button">快捷键设置</button>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
